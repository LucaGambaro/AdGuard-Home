services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    # Host mode: necessario per il server DHCP (broadcast sulla LAN).
    # Le porte sono quelle di AdGuard: 53 (DNS), 67/68 (DHCP), 80 (admin), 3000 (setup), 443/853/784/8853/5443 (DoH, DoT, DoQ, DNSCrypt).
    # Funziona solo su host Linux (es. Raspberry), non su Docker Desktop per Mac.
    network_mode: host
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
