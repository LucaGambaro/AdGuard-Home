services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
    ports:
      # Plain DNS
      - "53:53/tcp"
      - "53:53/udp"
      # DHCP server (decommenta se lo usi; richiede network_mode: host per funzionare davvero)
      # - "67:67/udp"
      # - "68:68/tcp"
      # - "68:68/udp"
      # Admin panel (setup iniziale su 3000) e HTTPS / DNS-over-HTTPS
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
      - "3000:3000/tcp"
      # DNS-over-TLS
      - "853:853/tcp"
      # DNS-over-QUIC
      - "784:784/udp"
      - "853:853/udp"
      - "8853:8853/udp"
      # DNSCrypt
      - "5443:5443/tcp"
      - "5443:5443/udp"
